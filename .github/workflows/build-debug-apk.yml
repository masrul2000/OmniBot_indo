name: Build Debug APK

# Builds an installable debug APK (no signing secrets needed) and uploads it
# as a downloadable artifact: Actions tab -> the run -> Artifacts.
on:
  workflow_dispatch:
  push:
    branches:
      - 'feat/**'

concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '22'
  PNPM_VERSION: '10.28.0'
  FLUTTER_VERSION: '3.47.2'
  ANDROID_PLATFORM_VERSION: '37.0'
  NDK_VERSION: '28.2.13676358'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: webchat/pnpm-lock.yaml

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK platform and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-${{ env.ANDROID_PLATFORM_VERSION }}" "ndk;${{ env.NDK_VERSION }}"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: Flutter dependencies
        working-directory: ui
        run: flutter pub get --enforce-lockfile

      - name: Flutter analyze (informational)
        working-directory: ui
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Build debug APK
        run: >-
          ./gradlew --no-daemon --max-workers=2
          -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED"
          :app:assembleDevelopStandardDebug
          -Ptarget=lib/main_standard.dart

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: omnibot-indo-debug-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Publish APK as pre-release (direct download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="$(find app/build/outputs/apk -name '*.apk' | head -1)"
          cp "$APK" omnibot-indo-debug.apk
          gh release delete debug-latest --cleanup-tag -y || true
          gh release create debug-latest omnibot-indo-debug.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "Debug APK (latest)" \
            --notes "Debug build from $GITHUB_REF_NAME @ ${GITHUB_SHA::7}"
